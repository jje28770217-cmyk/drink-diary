# Supabase 무료 프로젝트가 일주일 접속 없음으로 일시정지되는 것을 막기 위해 하루 한 번 작은 기록 호출을 보냅니다.
# 필요한 설정: 저장소 Settings → Secrets and variables → Actions 에 아래 두 값을 등록
#   SUPABASE_URL : 프로젝트 주소 (https://xxxx.supabase.co)
#   SUPABASE_KEY : publishable(anon) 키. secret/service_role 키는 절대 넣지 마세요
# 직접 실행해 보려면 Actions 탭 → Supabase keep-alive → Run workflow
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * *'   # 매일 03:17 UTC (한국 시간 12:17)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call keepalive_ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then echo "SUPABASE_URL / SUPABASE_KEY 비밀값이 없습니다"; exit 1; fi
          curl --fail --silent --show-error --max-time 30 -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
          echo
