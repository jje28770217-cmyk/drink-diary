<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3fcf3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drink Balance">
<title>Drink Balance</title>
<!-- 디자인: css/tokens.css(색·값) → css/style.css(컴포넌트) → css/responsive.css(PC/태블릿). 이 3개와 images/ 만 바꿔도 기능은 그대로 -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app" class="app"></div>
<nav id="nav" class="nav" aria-label="메인 메뉴"></nav>
<div id="amount" class="screen" hidden></div>
<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-back" data-act="closeSheet"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- 설정 -->
<script src="js/config.js"></script>
<!-- 데이터: 제품 DB, 건강 지침 -->
<script src="js/data/products.js"></script>
<script src="js/data/guidelines.js"></script>
<!-- 기능(core): 화면과 무관한 계산·상태·통계 -->
<script src="js/core/calc.js"></script>
<script src="js/core/stats.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/draft.js"></script>
<!-- 저장(api): 브라우저 또는 로컬 서버 -->
<script src="js/api/local.js"></script>
<script src="js/api/remote.js"></script>
<script src="js/api/photos.js"></script>
<script src="js/api/index.js"></script>
<!-- 이미지: 연결 정보는 images/ 폴더에서 관리 -->
<script src="images/manifest.js"></script>
<script src="images/options.js"></script>
<script src="js/ui/icons-svg.js"></script>
<script src="js/ui/images.js"></script>
<!-- 화면(ui) -->
<script src="js/ui/views.js"></script>
<script src="js/ui/app.js"></script>
<!-- 홈 화면 설치·오프라인 (http/https 에서만 동작, 파일로 열면 건너뜀) -->
<script>if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
</body>
</html>
